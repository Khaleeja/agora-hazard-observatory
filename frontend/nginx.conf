server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # ── Caching ────────────────────────────────────────────────────────
    # index.html: never cached (references hashed bundles)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Hashed Angular bundles + fonts + images: cache 1 year
    location ~* \.(js|css|woff2?|ttf|eot|png|ico|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cesium assets (large, unversioned): cache 30 days
    location /assets/cesium/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Backend proxy ──────────────────────────────────────────────────
    # resolver 127.0.0.11 is Docker's internal DNS. Using a variable in
    # proxy_pass defers hostname resolution to request time so nginx starts
    # even when the backend container is not running (e.g. CI smoke test).
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── WebSocket proxy ────────────────────────────────────────────────
    location /ws/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA fallback ───────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
