# docker-compose.yml
# Avvia l'intero stack: mongodb + backend + frontend.
#
# Prima di usarlo:
#   1. Copia .env.example in .env e compila ARCGIS_API_KEY, MONGO_ROOT_USERNAME, MONGO_ROOT_PASSWORD
#   2. Copia backend/.env.example in backend/.env e compila gli altri valori backend
#
# Avvio: docker compose up --build

services:
  mongodb:
    image: mongo:7
    container_name: agora-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: agora
    volumes:
      - mongo_data:/data/
    ports:
      - target: 27017
        host_ip: "127.0.0.1"
        published: "${MONGO_COMPASS_PORT:-}"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/agora --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    container_name: agora-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      args:
        ARCGIS_API_KEY: ${ARCGIS_API_KEY}
    container_name: agora-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    name: agora-mongo-data
  backend_logs:
    name: agora-backend-logs
