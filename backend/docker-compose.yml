# docker-compose.yml
# Credentials and config are read from .env (gitignored).
# Copy .env.example to .env and fill in the values before running.
services:
  mongodb:
    image: mongo:7
    container_name: agora-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: agora
    volumes:
      - mongo_data:/data/
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/agora --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: .
    container_name: agora-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - backend_logs:/app/logs

volumes:
  mongo_data:
  backend_logs: