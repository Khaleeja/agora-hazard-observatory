name: Publish Docker images

# Runs when a GitHub Release is published (not on every push) — a tagged
# release is a deliberate "this version is ready to hand out" moment,
# distinct from backend-ci.yml/frontend-ci.yml's per-push build+smoke-test,
# which never pushes anywhere. workflow_dispatch exists only to (re)publish
# a release retroactively (e.g. one made before this workflow existed, so
# the `release` trigger never fired for it).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish images for (e.g. v1.0.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      lc: ${{ steps.lc.outputs.lc }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: lc
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT" # GHCR image names must be lowercase
      - id: tag
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

  backend:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ needs.setup.outputs.lc }}/agora-backend:${{ needs.setup.outputs.tag }}
            ghcr.io/${{ needs.setup.outputs.lc }}/agora-backend:latest

  frontend:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No ARCGIS_API_KEY build-arg, deliberately: the published image must
      # not bake in this project's own key (anyone who pulled the image
      # would silently spend its free-tier quota). The Dockerfile falls
      # back to environment.example.ts's placeholder when the arg is
      # absent, which is enough for the default OpenStreetMap basemap —
      # only the optional "ArcGIS World Imagery" layer needs a real key,
      # which anyone can supply by building their own image instead (see
      # frontend/README.md).
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ needs.setup.outputs.lc }}/agora-frontend:${{ needs.setup.outputs.tag }}
            ghcr.io/${{ needs.setup.outputs.lc }}/agora-frontend:latest
